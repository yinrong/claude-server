<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <span class="logo">⚡ Claude Hub</span>
      <button id="btn-new-agent" title="New Agent">＋</button>
    </div>
    <div id="agent-list-wrap">
      <ul id="agent-list"></ul>
    </div>
  </aside>

  <!-- ── Main panel ── -->
  <main id="main">
    <div id="toolbar">
      <span id="agent-label">未选择 Agent</span>
      <span id="agent-type-badge" class="badge hidden"></span>
      <button id="btn-history" class="icon-btn" title="加载更多历史">⏪</button>
      <button id="btn-chdir" class="icon-btn" title="切换工作目录">📂</button>
      <button id="btn-files" class="icon-btn" title="文件浏览">🗂</button>
      <button id="btn-attach" class="icon-btn" title="附件">📎</button>
      <input id="file-input" type="file" accept="image/*,.pdf,.txt,.js,.ts,.py,.json,.md" multiple style="display:none" />
      <span id="conn-dot" class="status-dot disconnected"></span>
    </div>

    <!-- xterm terminal -->
    <div id="terminal-wrap">
      <div id="terminal"></div>
    </div>

  </main>

</div>

<!-- ── Right-click context menu ── -->
<div id="context-menu" class="hidden">
  <div id="ctx-agent-name" class="ctx-label"></div>
  <button id="ctx-delete" class="ctx-item danger">🗑 删除 Agent</button>
</div>

<!-- ── New Agent modal ── -->
<div id="modal-overlay" class="modal-backdrop hidden">
  <div id="modal">
    <h3>新建 Agent</h3>
    <label>名称<input id="modal-name" type="text" placeholder="e.g. Master" /></label>
    <label>类型
      <select id="modal-type">
        <option value="worker">Worker</option>
        <option value="master">Master</option>
      </select>
    </label>
    <label>工作目录<input id="modal-cwd" type="text" value="/home" /></label>
    <div id="browse-wrap">
      <ul id="browse-list"></ul>
    </div>
    <label>适配器
      <select id="modal-adapter">
        <option value="claude-code">claude-code</option>
        <option value="mock">mock</option>
      </select>
    </label>
    <label>模型
      <div style="display:flex;gap:6px;align-items:center">
        <select id="modal-model" style="flex:1"><option value="">（加载中…）</option></select>
        <button id="modal-model-refresh" type="button" title="刷新模型列表">🔄</button>
      </div>
    </label>
    <div class="modal-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-confirm" class="primary-btn">创建</button>
    </div>
  </div>
</div>

<!-- Change directory modal -->
<div id="chdir-overlay" class="modal-backdrop hidden">
  <div id="chdir-modal">
    <h3>切换工作目录</h3>
    <label>新目录<input id="chdir-path" type="text" value="/home" /></label>
    <div id="chdir-browse-wrap"><ul id="chdir-browse-list"></ul></div>
    <label>最近使用
      <select id="chdir-recent"><option value="">（加载中）</option></select>
    </label>
    <div class="modal-actions">
      <button id="chdir-cancel">取消</button>
      <button id="chdir-confirm" class="primary-btn">切换并重启</button>
    </div>
  </div>
</div>

<!-- File browser panel (slide from right) -->
<div id="file-panel" class="hidden">
  <div id="file-panel-header">
    <span id="file-panel-path">/</span>
    <button id="file-panel-download" class="icon-btn hidden" title="下载">⬇</button>
    <button id="file-panel-close">✕</button>
  </div>
  <div id="file-panel-list"></div>
  <pre id="file-panel-content" class="hidden"></pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
